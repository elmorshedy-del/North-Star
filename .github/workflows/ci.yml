name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Proves the architecture rules still fire. A green lint job means
      # nothing if the rules themselves have been quietly defanged.
      - name: Verify architecture guardrails
        run: npm run verify:guardrails

      - name: Unit tests
        run: npm test
